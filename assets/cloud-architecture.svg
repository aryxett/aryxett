<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="My AWS practice architecture: CloudFront, S3, EC2 in a VPC, IAM role, CloudWatch.">
<style>
.dash{stroke-dasharray:6 8;animation:da 1.2s linear infinite}
@keyframes da{to{stroke-dashoffset:-28}}
.f{animation:f .9s ease-out both}
@keyframes f{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.dash,.f{animation:none}}
</style>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d0221"/><stop offset="1" stop-color="#1b1035"/></linearGradient>
<linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241145"/><stop offset="1" stop-color="#12082a"/></linearGradient>
</defs>
<rect width="1200" height="360" rx="16" fill="url(#bg)"/>
<text x="600" y="38" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="20" font-weight="700" fill="#c77dff">My AWS practice architecture</text>
<g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
<g class="f" style="animation-delay:.05s">
<rect x="40" y="90" width="180" height="110" rx="12" fill="url(#box)" stroke="#c77dff" stroke-opacity=".5"/>
<text x="130" y="130" font-size="22" font-weight="700" fill="#ffffff">Users</text>
<text x="130" y="162" font-size="15" fill="#90e0ef">Web · Mobile · Voice</text>
</g>
<g class="f" style="animation-delay:.25s">
<rect x="300" y="90" width="180" height="110" rx="12" fill="url(#box)" stroke="#c77dff" stroke-opacity=".5"/>
<text x="390" y="130" font-size="22" font-weight="700" fill="#ffffff">CloudFront</text>
<text x="390" y="162" font-size="15" fill="#90e0ef">CDN · Caching</text>
</g>
<g class="f" style="animation-delay:.45s">
<rect x="560" y="90" width="180" height="110" rx="12" fill="url(#box)" stroke="#90e0ef" stroke-opacity=".7"/>
<text x="650" y="130" font-size="22" font-weight="700" fill="#ffffff">EC2 in VPC</text>
<text x="650" y="162" font-size="15" fill="#90e0ef">Linux · FastAPI · Docker</text>
<text x="650" y="184" font-size="15" fill="#90e0ef">Security Groups</text>
</g>
<g class="f" style="animation-delay:.65s">
<rect x="820" y="90" width="180" height="110" rx="12" fill="url(#box)" stroke="#c77dff" stroke-opacity=".5"/>
<text x="910" y="130" font-size="22" font-weight="700" fill="#ffffff">S3</text>
<text x="910" y="162" font-size="15" fill="#90e0ef">Static assets · Storage</text>
</g>
<g class="f" style="animation-delay:.85s">
<rect x="1020" y="90" width="140" height="110" rx="12" fill="url(#box)" stroke="#c77dff" stroke-opacity=".5"/>
<text x="1090" y="130" font-size="22" font-weight="700" fill="#ffffff">IAM Role</text>
<text x="1090" y="162" font-size="15" fill="#90e0ef">Least privilege</text>
</g>
<line class="dash" x1="220" y1="145" x2="300" y2="145" stroke="#90e0ef" stroke-width="2"/>
<line class="dash" x1="480" y1="145" x2="560" y2="145" stroke="#90e0ef" stroke-width="2"/>
<line class="dash" x1="740" y1="145" x2="820" y2="145" stroke="#90e0ef" stroke-width="2"/>
<line class="dash" x1="1000" y1="145" x2="1020" y2="145" stroke="#90e0ef" stroke-width="2"/>
<g class="f" style="animation-delay:1.05s">
<rect x="300" y="250" width="280" height="70" rx="12" fill="url(#box)" stroke="#3fb950" stroke-opacity=".6"/>
<text x="440" y="280" font-size="19" font-weight="700" fill="#ffffff">CloudWatch</text>
<text x="440" y="305" font-size="15" fill="#90e0ef">Metrics · Logs · Alarms</text>
</g>
<g class="f" style="animation-delay:1.2s">
<rect x="640" y="250" width="280" height="70" rx="12" fill="url(#box)" stroke="#3fb950" stroke-opacity=".6"/>
<text x="780" y="280" font-size="19" font-weight="700" fill="#ffffff">CI / CD — GitHub Actions</text>
<text x="780" y="305" font-size="15" fill="#90e0ef">build · test · deploy on push</text>
</g>
<line class="dash" x1="440" y1="250" x2="620" y2="200" stroke="#3fb950" stroke-width="2"/>
<line class="dash" x1="780" y1="250" x2="700" y2="200" stroke="#3fb950" stroke-width="2"/>
</g>
</svg>
