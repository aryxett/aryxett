<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
<style>.g{animation:g 3.5s ease-in-out infinite alternate}@keyframes g{0%{transform:translateX(-500px)}100%{transform:translateX(1100px)}}@media (prefers-reduced-motion:reduce){.g{animation:none}}</style>
<defs>
<linearGradient id="l" x1="0" x2="1"><stop offset="0" stop-color="#c77dff" stop-opacity="0"/><stop offset=".5" stop-color="#c77dff" stop-opacity=".5"/><stop offset="1" stop-color="#c77dff" stop-opacity="0"/></linearGradient>
<linearGradient id="o" x1="0" x2="1"><stop offset="0" stop-color="#7209b7" stop-opacity="0"/><stop offset=".5" stop-color="#7209b7"/><stop offset="1" stop-color="#7209b7" stop-opacity="0"/></linearGradient>
</defs>
<rect y="11" width="1200" height="2" fill="url(#l)"/>
<rect class="g" x="0" y="10" width="400" height="4" rx="2" fill="url(#o)"/>
</svg>
